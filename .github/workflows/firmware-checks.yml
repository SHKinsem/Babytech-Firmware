name: Firmware checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install C and C++ compilers
        run: sudo apt-get update && sudo apt-get install --yes g++

      - name: Install frontend dependencies
        working-directory: tools/motor-protocol-demo
        run: npm ci

      - name: Test and build frontend
        working-directory: tools/motor-protocol-demo
        run: |
          npm test
          npm run build:device
          npm run build
          npm run test:sites

      - name: Run protocol, motion, raw CAN, and demo tests
        run: |
          python tools/test_protocol.py
          python tools/test_pairing_record.py --sanitize
          python tools/test_pairing_store.py --sanitize
          python tests/test_prepare_board_pairing.py
          python tools/test_cloud_session.py --sanitize
          python tools/test_motion.py
          python tools/test_raw_can.py
          python tools/test_demo.py

      - name: Run flash utility unit tests
        run: python -m unittest discover -s tests -p 'test_flash_device.py'

      - name: Check source archive build dependencies
        run: python -m unittest discover -s tests -p 'test_package_device.py'

      - name: Test OTA page when available
        run: |
          if [[ -f tests/ota-page.test.cjs ]]; then
            node --test tests/ota-page.test.cjs
          else
            echo "OTA page test not present; skipping"
          fi

  firmware-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: python -m pip install platformio==6.1.19

      - name: Install host SHA-256 test dependency
        run: sudo apt-get update && sudo apt-get install --yes libssl-dev

      - name: Build BRAIN and MOTION migration variants
        shell: bash
        run: |
          set -euo pipefail

          if [[ -d main-controller ]]; then
            brain_dir=main-controller
          elif [[ -d brain ]]; then
            brain_dir=brain
          else
            echo "Could not find main-controller or brain firmware directory" >&2
            exit 1
          fi

          if [[ -d device-controller ]]; then
            motion_dir=device-controller
          elif [[ -d motion ]]; then
            motion_dir=motion
          else
            echo "Could not find device-controller or motion firmware directory" >&2
            exit 1
          fi

          pio run --project-dir "$brain_dir"
          python tools/test_display_view.py
          PLATFORMIO_BUILD_SRC_FLAGS=-DBABYTECH_BOARD_LINK_V4=1 pio run --project-dir "$brain_dir"
          pio run --project-dir "$brain_dir"
          pio run --project-dir "$motion_dir"
          python tools/test_cloud_link.py --sanitize
          python tools/test_cloud_contract.py
          python tools/test_board_messages.py --sanitize
          python tools/test_board_commands.py --sanitize
          python tools/test_product_context.py --sanitize
          python tools/test_legacy_context_store.py --sanitize
          python tools/test_product_state.py --sanitize
          python tools/test_brain_state_store.py --sanitize
          python tools/test_motion_state_record.py --sanitize
          python tools/test_motion_state_store.py --sanitize
          python tools/test_motion_state_recovery.py --sanitize
          python tools/test_motion_result_queue.py --sanitize
          python tools/test_board_commissioning.py --sanitize
          python tools/test_maintenance_console.py --sanitize
          python tools/test_maintenance_export.py --sanitize
          python tools/test_motion_export_snapshot.py --sanitize
          python tools/test_board_export_transfer.py --sanitize
          python tools/test_board_maintenance.py --sanitize
          python tools/test_board_install.py --sanitize
          python tools/test_motion_install.py --sanitize
          python tools/test_brain_installer.py --sanitize
          python -m unittest discover -s tests -p test_capture_board_export.py
          python -m unittest discover -s tests -p test_maintenance_wiring.py
          python tools/test_board_link.py --sanitize
          python tools/test_board_discovery.py --sanitize
          python tools/test_board_arduino.py --sanitize
          python tools/test_brain_controller.py --sanitize
          python tools/test_brain_network.py --sanitize
          python tools/test_brain_station.py --sanitize
          python tools/test_brain_network_console.py --sanitize
          python -m unittest discover -s tests -p test_configure_brain_network.py
          python -m unittest discover -s tests -p test_package_ota.py
          PLATFORMIO_BUILD_SRC_FLAGS=-DMOTION_UART_PEER=4 pio run --project-dir "$motion_dir"
          PLATFORMIO_BUILD_SRC_FLAGS=-DMOTION_UART_PEER=1 pio run --project-dir "$motion_dir"
          pio run --project-dir "$motion_dir"
