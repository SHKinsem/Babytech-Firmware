[platformio]
default_envs = brain
boards_dir = ../boards

[env:brain]
; Screen baseline: Arduino 3.3 / IDF 5.5. Motion keeps its own SDK.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.30-2/platform-espressif32.zip
board = babytech_esp32s3_n16r8
framework = arduino
extra_scripts = pre:../tools/export_boot_app0.py
monitor_speed = 115200
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DFIRMWARE_VERSION=\"0.2.0\"
    -DLV_CONF_SKIP=1
    -DLV_COLOR_DEPTH=16
    -DLV_FONT_MONTSERRAT_20=1
    -DLV_FONT_MONTSERRAT_28=1
lib_deps =
    BabytechCloudLink=symlink://../shared/BabytechCloudLink
    lvgl/lvgl @ 8.4.0
    bblanchon/ArduinoJson @ ^6.21.5
    BoardProtocol=symlink://../shared/BoardProtocol
    ProductBoardLink=symlink://../shared/ProductBoardLink
    BabytechDisplayCore=symlink://../shared/BabytechDisplayCore
    BabytechDisplayLvgl=symlink://../shared/BabytechDisplayLvgl
    BabytechPanelSt7796=symlink://../shared/BabytechPanelSt7796
