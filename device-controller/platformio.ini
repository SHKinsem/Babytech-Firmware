[platformio]
default_envs = motion

[env:motion]
platform = espressif32@6.4.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.embed_txtfiles =
    data/index.html
    data/demo_flow.json
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
build_flags =
    -std=gnu++17
    -fstack-usage
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    BoardProtocol=symlink://../shared/BoardProtocol
    BabytechDisplayCore=symlink://../shared/BabytechDisplayCore
    WifiOta=symlink://../shared/WifiOta
build_unflags = -std=gnu++11
