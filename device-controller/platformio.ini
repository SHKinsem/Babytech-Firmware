[platformio]
default_envs = motion

[env:motion]
platform = espressif32@6.4.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.embed_txtfiles =
    data/index.html
    data/demo_flow.json
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
build_flags =
    -std=gnu++17
    -fstack-usage
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; Default UART v3 is selected in UartPeer.h; override once for paired v4 tests.
lib_deps =
    BabytechCloudLink=symlink://../shared/BabytechCloudLink
    BoardProtocol=symlink://../shared/BoardProtocol
    ProductBoardLink=symlink://../shared/ProductBoardLink
    BabytechDisplayCore=symlink://../shared/BabytechDisplayCore
    WifiOta=symlink://../shared/WifiOta
    bblanchon/ArduinoJson @ ^6.21.3
    knolleary/PubSubClient @ ^2.8
build_unflags = -std=gnu++11
